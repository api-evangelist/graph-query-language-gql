aid: graph-query-language-gql
name: Graph Query Language (GQL)
description: >-
  GQL is an international standard query language for property graph databases,
  developed by ISO/IEC JTC1 SC32 WG3 to provide a declarative way to query and
  manipulate graph data structures. Published as ISO/IEC 39075:2024 on April
  17, 2024, the standard complements SQL for graph workloads and builds on
  prior art including openCypher, PGQL, GSQL, and G-CORE. Effective
  implementation supports data-driven strategies and helps maintain data
  integrity and portability across graph database systems.
